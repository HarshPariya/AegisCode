<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <radialGradient id="shieldInner" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0C2548" />
      <stop offset="60%" stop-color="#071224" />
      <stop offset="100%" stop-color="#040812" />
    </radialGradient>

    <!-- Code Element Gradient (Cyan) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Code Element Gradient (Emerald) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#shieldBorder)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Cyber Ring / Subtle Grid Accents -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 12" />

  <!-- Aegis Shield Outline with Glow -->
  <path
    d="M 256, 76 L 396, 126 C 396, 290 326, 388 256, 436 C 186, 388 116, 290 116, 126 Z"
    fill="url(#shieldInner)"
    stroke="url(#shieldBorder)"
    stroke-width="16"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Inner Cybernetic Shield Facet -->
  <path
    d="M 256, 102 L 372, 144 C 372, 276 312, 362 256, 404 C 200, 362 140, 276 140, 144 Z"
    fill="none"
    stroke="#00F0FF"
    stroke-width="2"
    stroke-opacity="0.25"
  />

  <!-- Left Code Bracket < -->
  <path
    d="M 216, 206 L 166, 256 L 216, 306"
    fill="none"
    stroke="url(#cyanGrad)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Code Bracket > -->
  <path
    d="M 296, 206 L 346, 256 L 296, 306"
    fill="none"
    stroke="url(#emeraldGrad)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Autonomous Agentic Core: Glowing AI Slash -->
  <path
    d="M 270, 196 L 242, 316"
    fill="none"
    stroke="#38BDF8"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Central Neural Beacon Node -->
  <circle cx="256" cy="256" r="10" fill="#00F0FF" />
  <circle cx="256" cy="256" r="18" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.6" />
</svg>
